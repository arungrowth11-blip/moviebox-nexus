name: Build MovieBox Nexus OS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Flutter project if absent
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --platforms=android --org com.moviebox.nexus --project-name moviebox_nexus .
          fi
          # This line removes the default test folder to prevent 'MyApp' error
          rm -rf test

      - name: Ensure main.dart is in lib/
        run: |
          mkdir -p lib
          if [ -s main.dart ]; then
            cp main.dart lib/main.dart
          fi
          if [ ! -s lib/main.dart ]; then
            echo "::error::lib/main.dart missing or empty"; exit 1
          fi

      - name: Add dependencies
        run: flutter pub add http shared_preferences url_launcher video_player qr_flutter

      - name: Patch AndroidManifest.xml
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          if not path.exists():
              raise SystemExit(f'Missing {path}')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ET.register_namespace('tools', 'http://schemas.android.com/tools')
          ET.register_namespace('app', 'http://schemas.android.com/apk/res-auto')
          A = '{http://schemas.android.com/apk/res/android}'
          tree = ET.parse(path)
          root = tree.getroot()

          for p in ('android.permission.INTERNET',
                    'android.permission.ACCESS_NETWORK_STATE',
                    'android.permission.WAKE_LOCK'):
              if not any(x.get(A+'name') == p for x in root.findall('uses-permission')):
                  ET.SubElement(root, 'uses-permission', {A+'name': p})

          fmap = {x.get(A+'name'): x for x in root.findall('uses-feature')}
          for name in ('android.software.leanback', 'android.hardware.touchscreen'):
              node = fmap.get(name)
              if node is None:
                  node = ET.SubElement(root, 'uses-feature', {A+'name': name})
              node.set(A+'required', 'false')

          app = root.find('application')
          if app is None:
              raise SystemExit('Missing <application>')
          app.set(A+'usesCleartextTraffic', 'true')
          app.set(A+'banner', '@mipmap/ic_launcher')

          for activity in app.findall('activity'):
              for filt in activity.findall('intent-filter'):
                  actions = {a.get(A+'name') for a in filt.findall('action')}
                  if 'android.intent.action.MAIN' in actions:
                      cats = {c.get(A+'name') for c in filt.findall('category')}
                      for cat in ('android.intent.category.LAUNCHER',
                                  'android.intent.category.LEANBACK_LAUNCHER'):
                          if cat not in cats:
                              ET.SubElement(filt, 'category', {A+'name': cat})

          tree.write(path, encoding='utf-8', xml_declaration=True)
          print('Manifest patched')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MovieBox-Nexus-OS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Nexus-OS-APK
          path: dist/MovieBox-Nexus-OS.apk
          if-no-files-found: error
          retention-days: 30
