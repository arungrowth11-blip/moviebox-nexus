name: Build MovieBox Nexus OS APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Recreate a clean Android scaffold and restore app source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s lib/main.dart ] && [ -s main.dart ]; then
            mkdir -p lib
            cp main.dart lib/main.dart
          fi
          test -s lib/main.dart || { echo 'ERROR: lib/main.dart is missing'; exit 1; }
          test -s pubspec.yaml || { echo 'ERROR: pubspec.yaml is missing'; exit 1; }

          backup_dir="$(mktemp -d)"
          cleanup() { rm -rf "$backup_dir"; }
          trap cleanup EXIT

          # Preserve app source and the dependency manifest while checking whether
          # the committed Android project is a complete Flutter scaffold.
          cp -a lib "$backup_dir/lib"
          if [ -d test ]; then cp -a test "$backup_dir/test"; fi
          cp pubspec.yaml "$backup_dir/pubspec.yaml"
          if [ -d native/android ]; then cp -a native/android "$backup_dir/native-android"; fi

          if [ -s android/app/src/main/res/drawable/tv_banner.png ]; then
            mkdir -p "$backup_dir/tv_banner"
            cp android/app/src/main/res/drawable/tv_banner.png "$backup_dir/tv_banner/tv_banner.png"
          fi

          scaffold_complete=1
          for required_file in \
            android/gradlew \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/settings.gradle.kts \
            android/build.gradle.kts \
            android/app/build.gradle.kts \
            android/app/src/main/AndroidManifest.xml; do
            if [ ! -s "$required_file" ]; then
              scaffold_complete=0
              break
            fi
          done

          if [ "$scaffold_complete" -ne 1 ]; then
            echo "Android scaffold is incomplete; regenerating only the Android platform folder."
            rm -rf android
            flutter create \
              --platforms=android \
              --org com.moviebox.nexus \
              --project-name moviebox_nexus \
              .
          else
            echo "Complete Android scaffold detected; preserving existing Gradle and manifest files."
          fi

          # Restore app source/manifest in case flutter create touched them.
          rm -rf lib
          cp -a "$backup_dir/lib" lib
          if [ -d "$backup_dir/test" ]; then
            rm -rf test
            cp -a "$backup_dir/test" test
          fi
          cp "$backup_dir/pubspec.yaml" pubspec.yaml
          if [ -d "$backup_dir/native-android" ]; then
            mkdir -p android/app/src/main/kotlin/com/moviebox/nexus
            cp "$backup_dir/native-android/MainActivity.kt" android/app/src/main/kotlin/com/moviebox/nexus/MainActivity.kt
            cp "$backup_dir/native-android/EmbeddedTorrentEngine.kt" android/app/src/main/kotlin/com/moviebox/nexus/EmbeddedTorrentEngine.kt
          fi

          if [ -s "$backup_dir/tv_banner/tv_banner.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp "$backup_dir/tv_banner/tv_banner.png" android/app/src/main/res/drawable/tv_banner.png
          fi

          test -s lib/main.dart
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.properties

      - name: Create Gradle init script for plugin portals and settings repositories
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/moviebox-maven-mirrors.init.gradle" <<'GRADLE_INIT'
          def mirrorUrls = [
              'https://maven-central-asia.storage-download.googleapis.com/maven2/',
              'https://maven-central.storage-download.googleapis.com/maven2/',
              'https://maven.aliyun.com/repository/central/',
              'https://repo.huaweicloud.com/repository/maven/'
          ]

          def addMovieBoxMirrors = { repositoryHandler, prefix ->
              mirrorUrls.eachWithIndex { mirrorUrl, index ->
                  repositoryHandler.maven {
                      name = "${prefix}MovieBoxMirror${index + 1}"
                      url = new URI(mirrorUrl)
                  }
              }
          }

          def addGoogleRepository = { repositoryHandler ->
              repositoryHandler.google()
          }

          // Gradle plugin marker artifacts are often hosted on the Plugin Portal,
          // not Maven Central. Keep mirrors first, but retain these official repos.
          gradle.beforeSettings { settings ->
              addMovieBoxMirrors.call(
                  settings.pluginManagement.repositories,
                  'Plugin'
              )
              addGoogleRepository.call(settings.pluginManagement.repositories)
              settings.pluginManagement.repositories.gradlePluginPortal()

              addMovieBoxMirrors.call(
                  settings.dependencyResolutionManagement.repositories,
                  'Dependency'
              )
              addGoogleRepository.call(
                  settings.dependencyResolutionManagement.repositories
              )
              settings.dependencyResolutionManagement.repositories.maven {
                  name = 'FrostWireJlibtorrent'
                  url = new URI('https://dl.frostwire.com/maven')
                  content { includeGroup('com.frostwire') }
              }
              println "[MovieBox CI] Plugin Portal + Maven mirrors + FrostWire repository configured before settings evaluation: ${settings.settingsDir}"
          }

          // Do not mutate project repositories here. The Android and Flutter
          // included builds use PREFER_SETTINGS, so project-level repositories
          // would cause a repository-mode conflict. beforeSettings above applies
          // the mirrors to each build's dependencyResolutionManagement instead.
          GRADLE_INIT

          test -s "$RUNNER_TEMP/moviebox-maven-mirrors.init.gradle"
          echo "Gradle init script created."

      - name: Cache verified Gradle 9.3.1 distribution
        id: gradle-dist-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-9.3.1
          key: gradle-9.3.1-bin-${{ runner.os }}-verified-v1

      - name: Download and verify Gradle distribution with mirror fallback
        if: steps.gradle-dist-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="9.3.1"
          EXPECTED_SHA256="b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06"
          ARCHIVE="$RUNNER_TEMP/gradle-${VERSION}-bin.zip"
          EXTRACT_DIR="$RUNNER_TEMP/gradle-extract"
          INSTALL_DIR="$RUNNER_TEMP/gradle-${VERSION}"

          urls=(
            "https://downloads.gradle.org/distributions/gradle-${VERSION}-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-${VERSION}-bin.zip"
            "https://mirrors.aliyun.com/gradle/distributions/v${VERSION}/gradle-${VERSION}-bin.zip"
            "https://mirror.nju.edu.cn/gradle/gradle-${VERSION}-bin.zip"
          )

          downloaded=0
          for url in "${urls[@]}"; do
            echo "Trying Gradle distribution host: ${url}"
            for attempt in 1 2 3; do
              rm -f "$ARCHIVE"
              if curl --fail --location --silent --show-error \
                  --retry 2 --retry-all-errors \
                  --connect-timeout 30 --max-time 1200 \
                  "$url" --output "$ARCHIVE"; then
                actual="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
                if [ "$actual" = "$EXPECTED_SHA256" ]; then
                  echo "Gradle archive checksum verified."
                  downloaded=1
                  break 2
                fi
                echo "::warning::Checksum mismatch from ${url}; trying another host."
                rm -f "$ARCHIVE"
              else
                echo "::warning::Download attempt ${attempt}/3 failed for ${url}."
              fi
              sleep $((attempt * 5))
            done
          done

          if [ "$downloaded" -ne 1 ]; then
            echo "::error::Could not download a checksum-valid Gradle ${VERSION} distribution from any configured host."
            exit 1
          fi

          rm -rf "$EXTRACT_DIR" "$INSTALL_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"
          test -x "$EXTRACT_DIR/gradle-${VERSION}/bin/gradle"
          mv "$EXTRACT_DIR/gradle-${VERSION}" "$INSTALL_DIR"
          rm -rf "$EXTRACT_DIR" "$ARCHIVE"

      - name: Add verified Gradle to PATH and route Flutter wrapper to it
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_HOME="$RUNNER_TEMP/gradle-9.3.1"
          test -x "$GRADLE_HOME/bin/gradle"
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          # Flutter invokes android/gradlew. Use the checksum-verified Gradle
          # installation above instead of triggering another remote wrapper download.
          cat > android/gradlew <<'GRADLE_SH'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required in GitHub Actions}"
          INIT_SCRIPT="$RUNNER_TEMP/moviebox-maven-mirrors.init.gradle"
          test -s "$INIT_SCRIPT" || {
            echo "ERROR: Maven mirror init script is missing: $INIT_SCRIPT" >&2
            exit 1
          }
          # Pass settings-level repository configuration into the main and included builds.
          exec gradle --init-script "$INIT_SCRIPT" "$@"
          GRADLE_SH
          chmod +x android/gradlew

          "$GRADLE_HOME/bin/gradle" --version
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Patch Android TV and network manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import xml.etree.ElementTree as ET
          import zlib

          resource_dir = Path('android/app/src/main/res/drawable')
          resource_dir.mkdir(parents=True, exist_ok=True)
          banner = resource_dir / 'tv_banner.png'
          if not banner.exists():
              width, height = 320, 180
              rows = []
              for y in range(height):
                  row = bytearray([0])
                  for x in range(width):
                      row.extend((10, 14 + y // 20, 30 + x // 24))
                  rows.append(bytes(row))

              def png_chunk(kind: bytes, payload: bytes) -> bytes:
                  return (struct.pack('>I', len(payload)) + kind + payload +
                          struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff))

              png = (b'\x89PNG\r\n\x1a\n' +
                     png_chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)) +
                     png_chunk(b'IDAT', zlib.compress(b''.join(rows))) +
                     png_chunk(b'IEND', b''))
              banner.write_bytes(png)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.is_file():
              raise SystemExit(f'Missing Android manifest: {manifest}')

          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          A = '{' + android_ns + '}'
          tree = ET.parse(manifest)
          root = tree.getroot()

          permissions = {
              node.get(A + 'name') for node in root.findall('uses-permission')
          }
          for permission in (
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.WAKE_LOCK',
          ):
              if permission not in permissions:
                  ET.SubElement(root, 'uses-permission', {A + 'name': permission})

          features = {node.get(A + 'name'): node for node in root.findall('uses-feature')}
          for feature, required in (
              ('android.software.leanback', 'false'),
              ('android.hardware.touchscreen', 'false'),
          ):
              node = features.get(feature)
              if node is None:
                  node = ET.SubElement(root, 'uses-feature', {A + 'name': feature})
              node.set(A + 'required', required)

          application = root.find('application')
          if application is None:
              raise SystemExit('AndroidManifest.xml has no <application> element')
          application.set(A + 'label', 'MovieBox Nexus OS')
          application.set(A + 'usesCleartextTraffic', 'true')
          application.set(A + 'banner', '@drawable/tv_banner')

          for activity in application.findall('activity'):
              for intent_filter in activity.findall('intent-filter'):
                  actions = {
                      node.get(A + 'name') for node in intent_filter.findall('action')
                  }
                  if 'android.intent.action.MAIN' not in actions:
                      continue
                  categories = {
                      node.get(A + 'name') for node in intent_filter.findall('category')
                  }
                  for category in (
                      'android.intent.category.LAUNCHER',
                      'android.intent.category.LEANBACK_LAUNCHER',
                  ):
                      if category not in categories:
                          ET.SubElement(intent_filter, 'category', {A + 'name': category})

          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          # flutter_vlc_player bundles native LibVLC libraries. If more than one
          # dependency packages libc++_shared.so, select one copy per ABI.
          gradle_app = Path('android/app/build.gradle.kts')
          if not gradle_app.is_file():
              raise SystemExit(f'Missing app Gradle Kotlin DSL file: {gradle_app}')
          gradle_text = gradle_app.read_text(encoding='utf-8')
          pick_first = 'pickFirsts += "lib/**/libc++_shared.so"'
          if pick_first not in gradle_text:
              gradle_text += (
                  '\n\nandroid {\n'
                  '    packaging {\n'
                  '        jniLibs {\n'
                  f'            {pick_first}\n'
                  '        }\n'
                  '    }\n'
                  '}\n'
              )
              gradle_app.write_text(gradle_text, encoding='utf-8')

          # AndroidX WorkManager creates its Room database through reflection during
          # AndroidX Startup. R8 full mode can strip the generated no-arg constructor,
          # causing WorkDatabase_Impl.<init>() NoSuchMethodException before Flutter starts.
          proguard = Path('android/app/proguard-rules.pro')
          proguard.parent.mkdir(parents=True, exist_ok=True)
          existing_rules = proguard.read_text(encoding='utf-8') if proguard.exists() else ''
          required_rules = '''
          # Keep constructors instantiated reflectively by WorkManager/Room under R8 full mode.
          -keep class androidx.work.impl.WorkDatabase_Impl { <init>(); }
          -keep class * extends androidx.room.RoomDatabase { <init>(); }
          -keep class * extends androidx.work.InputMerger { <init>(); }
          '''
          if 'androidx.work.impl.WorkDatabase_Impl' not in existing_rules:
              proguard.write_text(existing_rules.rstrip() + '\n' + required_rules.lstrip(), encoding='utf-8')

          # Attach the custom rules to the RELEASE variant; merely creating the file
          # does not make Gradle/R8 consume it.
          if '"proguard-rules.pro"' not in gradle_text:
              gradle_app.write_text(
                  gradle_text.rstrip() +
                  '\n\nandroid {\n'
                  '    buildTypes {\n'
                  '        release {\n'
                  '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")\n'
                  '        }\n'
                  '    }\n'
                  '}\n',
                  encoding='utf-8',
              )

          final_gradle = gradle_app.read_text(encoding='utf-8')
          final_rules = proguard.read_text(encoding='utf-8')
          if '"proguard-rules.pro"' not in final_gradle:
              raise SystemExit('ERROR: Release build does not reference proguard-rules.pro')
          if 'androidx.work.impl.WorkDatabase_Impl { <init>(); }' not in final_rules:
              raise SystemExit('ERROR: WorkDatabase_Impl constructor keep rule was not written')
          if 'extends androidx.work.InputMerger { <init>(); }' not in final_rules:
              raise SystemExit('ERROR: WorkManager InputMerger constructor keep rule was not written')

          print('Applied WorkManager/Room R8 constructor keep rules:')
          print(final_rules)
          print('Release Gradle config references proguard-rules.pro')
          PY

      - name: Configure FrostWire embedded torrent engine
        shell: bash
        run: |
          set -euo pipefail
          test -s native/android/MainActivity.kt
          test -s native/android/EmbeddedTorrentEngine.kt
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          app_gradle = Path('android/app/build.gradle.kts')
          app_text = app_gradle.read_text(encoding='utf-8')
          dependency = 'jlibtorrent-android:2.0.15.3@aar'
          if dependency not in app_text:
              app_text += """
          dependencies {
              implementation("com.frostwire:jlibtorrent-android:2.0.15.3@aar")
          }
          """

          min_sdk_pattern = r'minSdk\s*=\s*flutter\.minSdkVersion'
          if re.search(min_sdk_pattern, app_text):
              app_text = re.sub(
                  min_sdk_pattern,
                  'minSdk = maxOf(26, flutter.minSdkVersion)',
                  app_text,
              )
          elif 'minSdk = maxOf(26, flutter.minSdkVersion)' not in app_text:
              raise SystemExit('Could not locate Flutter minSdk declaration to raise it to 26.')

          app_gradle.write_text(app_text, encoding='utf-8')
          final_app = app_gradle.read_text(encoding='utf-8')
          if dependency not in final_app:
              raise SystemExit('FrostWire jlibtorrent Android AAR dependency was not configured.')
          if 'minSdk = maxOf(26, flutter.minSdkVersion)' not in final_app:
              raise SystemExit('Android minSdk was not raised to the jlibtorrent requirement.')

          init_script = Path(os.environ['RUNNER_TEMP']) / 'moviebox-maven-mirrors.init.gradle'
          init_text = init_script.read_text(encoding='utf-8')
          if 'https://dl.frostwire.com/maven' not in init_text:
              raise SystemExit('FrostWire Maven repository is missing from the Gradle init script.')
          print('Configured FrostWire jlibtorrent Android AAR 2.0.15.3 (all ABIs, minSdk 26).')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release APK (retry transient network failures)
        shell: bash
        run: |
          set -uo pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          for attempt in 1 2 3; do
            echo "Release build attempt ${attempt}/3"
            set +e
            flutter build apk --release 2>&1 | tee "$log_file"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'HTTP response code: (408|429|5[0-9][0-9])|Received status code[[:space:]:]+(408|429|5[0-9][0-9])|Gateway Time[- ]out|timed out|UnknownHostException|Temporary failure in name resolution|Connection reset|connection timed out|Could not GET .*github\.com/JetBrains/|Could not GET .*repo\.maven\.apache\.org/' "$log_file"; then
              echo 'Build failed for a non-transient reason; not retrying.'
              exit "$build_status"
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "Transient network failure detected; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo 'Gradle/build downloads still failing after three attempts.'
          exit 1

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MovieBox-Nexus-OS.apk
          test -s dist/MovieBox-Nexus-OS.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Nexus-OS-APK
          path: dist/MovieBox-Nexus-OS.apk
          if-no-files-found: error
          retention-days: 30
