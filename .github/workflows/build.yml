name: Build MovieBox Nexus OS APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Flutter Android scaffold and preserve source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f lib/main.dart ] && [ -f main.dart ]; then
            mkdir -p lib
            cp main.dart lib/main.dart
          fi
          # An android/ directory containing only assets is NOT a Flutter scaffold.
          if [ ! -f pubspec.yaml ] || [ ! -f android/app/src/main/AndroidManifest.xml ] || [ ! -f android/settings.gradle.kts ] && [ ! -f android/settings.gradle ]; then
            backup_dir="$(mktemp -d)"
            if [ -f lib/main.dart ]; then cp lib/main.dart "$backup_dir/main.dart"; fi
            if [ -f pubspec.yaml ]; then cp pubspec.yaml "$backup_dir/pubspec.yaml"; fi
            flutter create --platforms=android --org com.moviebox.nexus --project-name moviebox_nexus .
            if [ -f "$backup_dir/main.dart" ]; then cp "$backup_dir/main.dart" lib/main.dart; fi
            if [ -f "$backup_dir/pubspec.yaml" ]; then cp "$backup_dir/pubspec.yaml" pubspec.yaml; fi
            rm -rf "$backup_dir"
          fi
          test -f android/app/src/main/AndroidManifest.xml
          test -s lib/main.dart
      - name: Patch Android TV and network manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          if not path.exists(): raise SystemExit(f'Missing {path}')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          A = '{http://schemas.android.com/apk/res/android}'
          tree = ET.parse(path)
          root = tree.getroot()
          for permission in ('android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE', 'android.permission.WAKE_LOCK'):
              if not any(x.get(A+'name') == permission for x in root.findall('uses-permission')):
                  ET.SubElement(root, 'uses-permission', {A+'name': permission})
          features = {x.get(A+'name'): x for x in root.findall('uses-feature')}
          for name, required in (('android.software.leanback', 'false'), ('android.hardware.touchscreen', 'false')):
              node = features.get(name)
              if node is None: node = ET.SubElement(root, 'uses-feature', {A+'name': name})
              node.set(A+'required', required)
          app = root.find('application')
          if app is None: raise SystemExit('Missing application element')
          app.set(A+'label', 'MovieBox Nexus OS')
          app.set(A+'usesCleartextTraffic', 'true')  # User-configured IPTV streams may be HTTP.
          app.set(A+'banner', '@drawable/tv_banner')
          for activity in app.findall('activity'):
              for intent in activity.findall('intent-filter'):
                  actions = {x.get(A+'name') for x in intent.findall('action')}
                  if 'android.intent.action.MAIN' in actions:
                      cats = {x.get(A+'name') for x in intent.findall('category')}
                      for category in ('android.intent.category.LAUNCHER', 'android.intent.category.LEANBACK_LAUNCHER'):
                          if category not in cats: ET.SubElement(intent, 'category', {A+'name': category})
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format check
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
      - name: Build release APK
        run: flutter build apk --release
      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MovieBox-Nexus-OS.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Nexus-OS-APK
          path: dist/MovieBox-Nexus-OS.apk
          if-no-files-found: error
          retention-days: 30
