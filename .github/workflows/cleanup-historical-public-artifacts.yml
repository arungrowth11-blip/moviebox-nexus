name: One-time historical public artifact cleanup

on:
  push:
    branches:
      - fix/auto-failure-diagnostics-20261125

permissions:
  actions: write

jobs:
  cleanup:
    if: github.event_name == 'push' && github.event.head_commit.message == 'cleanup-public-actions-artifacts: 2026-11-27'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the confirmed historical artifact IDs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact_ids=(
            14632877224
            14633361842
            14739468406
            14742559967
            14942092657
            14954742643
            14941532918
            14975958198
            14982695345
            14977071214
            14985734037
          )

          for artifact_id in "${artifact_ids[@]}"; do
            http_code="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/artifact-delete-response.json" \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id")"

            case "$http_code" in
              204)
                echo "Deleted historical artifact $artifact_id"
                ;;
              404)
                echo "Historical artifact $artifact_id was already absent or expired"
                ;;
              *)
                echo "::error::Could not delete artifact $artifact_id (HTTP $http_code)"
                exit 1
                ;;
            esac
          done

          echo "Historical public artifact cleanup completed."
